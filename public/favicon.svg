<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 柔和渐变背景：靛蓝 → 紫罗兰 → 粉紫 -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C83FD"/>
      <stop offset="55%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#E3A0F6"/>
    </linearGradient>

    <!-- 左上角高光，营造玻璃质感 -->
    <radialGradient id="glow" cx="28%" cy="18%" r="75%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- 前景图形柔和投影 -->
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#4A3A8A" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- 圆角方形底 -->
  <rect x="0" y="0" width="512" height="512" rx="104" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="104" fill="url(#glow)"/>

  <!-- 前景：扫描框 + 人物剪影（识别/检测影响者） -->
  <g filter="url(#shadow)" transform="translate(76.8, 76.8) scale(1.4)">
    <path d="M224,40V76a8,8,0,0,1-16,0V48H180a8,8,0,0,1,0-16h36A8,8,0,0,1,224,40Zm-8,132a8,8,0,0,0-8,8v28H180a8,8,0,0,0,0,16h36a8,8,0,0,0,8-8V180A8,8,0,0,0,216,172ZM76,208H48V180a8,8,0,0,0-16,0v36a8,8,0,0,0,8,8H76a8,8,0,0,0,0-16ZM40,84a8,8,0,0,0,8-8V48H76a8,8,0,0,0,0-16H40a8,8,0,0,0-8,8V76A8,8,0,0,0,40,84Zm136,92a8,8,0,0,1-6.41-3.19,52,52,0,0,0-83.2,0,8,8,0,1,1-12.8-9.62A67.94,67.94,0,0,1,101,141.51a40,40,0,1,1,53.94,0,67.94,67.94,0,0,1,27.43,21.68A8,8,0,0,1,176,176Zm-48-40a24,24,0,1,0-24-24A24,24,0,0,0,128,136Z" fill="#FFFFFF"/>
  </g>
</svg>
